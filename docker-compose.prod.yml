# Producción (EC2): clonar repo, copiar .env y ejecutar ./deploy.sh
services:
  postgres:
    image: postgres:16-alpine
    container_name: stonegrass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-stonegrass}
    volumes:
      - stonegrass_pg_data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - stonegrass

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: stonegrass-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-game}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stonegrass}
      API_PORT: "3001"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stonegrass

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: stonegrass-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - stonegrass

volumes:
  stonegrass_pg_data:

networks:
  stonegrass:
    driver: bridge
